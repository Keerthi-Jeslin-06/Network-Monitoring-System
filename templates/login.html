<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Login - Network Monitoring System
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }

        .login-box {

            background: white;

            width: 380px;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.12);

        }

        h1 {

            text-align: center;

            color: #1f2937;

            margin-bottom: 10px;

        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

        }

        input:focus {

            outline: none;

            border-color: #1f2937;

        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1f2937;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {

            background: #111827;

        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

        }

        .demo {

            margin-top: 20px;

            padding: 12px;

            background: #f3f4f6;

            border-radius: 8px;

            text-align: center;

            color: #4b5563;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="login-box">

    <h1>
        Network Monitoring
    </h1>

    <div class="subtitle">
        System Login
    </div>


    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}


    <form
        method="POST"
        action="/login">


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required>


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>


        <button type="submit">

            Login

        </button>

    </form>


    <div class="demo">

        Demo Username: <b>admin</b><br>

        Demo Password: <b>Keerthi@NMS2026#</b>

    </div>

</div>


</body>

</html>
